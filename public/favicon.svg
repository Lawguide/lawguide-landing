<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#2563eb" rx="4"/>
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center pillar -->
    <line x1="16" y1="7" x2="16" y2="25"/>
    <!-- Crossbar -->
    <line x1="8" y1="11" x2="24" y2="11"/>
    <!-- Base -->
    <line x1="11" y1="25" x2="21" y2="25"/>
    <!-- Left pan lines -->
    <line x1="8" y1="11" x2="6" y2="18"/>
    <line x1="6" y1="18" x2="10" y2="18"/>
    <!-- Right pan lines -->
    <line x1="24" y1="11" x2="26" y2="18"/>
    <line x1="26" y1="18" x2="22" y2="18"/>
    <!-- Top circle -->
    <circle cx="16" cy="7" r="1.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>
